pre-commit:
  parallel: true
  commands:
    # Auto-fix formatting/lint issues in staged files and re-stage them,
    # instead of failing the commit. Only real lint errors (not fixable) block it.
    lint:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs}'
      run: npx eslint --fix {staged_files}
      stage_fixed: true

    format:
      glob: '*.{json,md,yml,yaml}'
      run: npx prettier --write {staged_files}
      stage_fixed: true

    types:
      glob: '*.{ts,tsx}'
      run: npx tsc

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit
